<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="shapes">
      <button class="shape circle" id="circle" aria-label="Turn background red"></button>
      <button class="shape triangle" id="triangle" aria-label="Turn background yellow"></button>
      <button class="shape square" id="square" aria-label="Turn background green"></button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
